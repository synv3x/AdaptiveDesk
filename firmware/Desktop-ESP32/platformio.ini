; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = adaptivedesk_demo

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Keep the original sketch buildable without the demo sources:
build_src_filter = +<*> -<demo/>

; Classroom hardware demo: slide pot + FSR in, RGB LED + buzzer out, WebSocket to the dashboard.
; Build/upload:  pio run -e adaptivedesk_demo -t upload
[env:adaptivedesk_demo]
; Pinned to the version this firmware was compiled against (Arduino-ESP32 core 3.x).
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<demo/>
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0
